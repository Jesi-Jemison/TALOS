name: TALOS Vercel web checks
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/vercel-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/vercel-web.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
